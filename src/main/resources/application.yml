spring:
  application:
    name: anomaly-detect

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/anomalydetect
    username: postgres
    password: postgres

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: anomaly-detect
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.anomalydetect.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

anomaly:
  buffer:
    capacity: 10000
  kafka:
    topics:
      ticks: stock-ticks
      anomalies: anomalies
  detection:
    z-score-threshold: 2.5
    rolling-window-size: 100
    baseline-recalculation-interval-seconds: 60
    min-data-points: 30
  tickers:
    - AAPL
    - GOOGL
    - BTC/USD
    - ETH/USD
  ai:
    provider: cloudflare
    timeout-seconds: 10
    cloudflare:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
  data-retention:
    tick-data-days: 90
  similarity:
    min-cosine-similarity: 0.7
    top-k: 3
  market-data:
    provider: alpaca
    reconnect-initial-delay-ms: 1000
    reconnect-max-delay-ms: 60000

server:
  port: 8080
