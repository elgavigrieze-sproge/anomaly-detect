<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detector - Live Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00d26a;
        }

        .status-dot.disconnected {
            background: #ff4757;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .alerts-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .alerts-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alerts-header h2 {
            font-size: 1.2rem;
        }

        .clear-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #e4e4e4;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .alerts-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .alert-item {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideIn 0.3s ease;
        }

        .alert-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .alert-ticker {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .severity-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-CRITICAL { background: #ff4757; color: white; }
        .severity-HIGH { background: #ff6b35; color: white; }
        .severity-MEDIUM { background: #ffa502; color: #1a1a2e; }
        .severity-LOW { background: #2ed573; color: #1a1a2e; }

        .ticker-symbol {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .anomaly-type {
            font-size: 0.85rem;
            color: #888;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .alert-metrics {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .metric-label {
            color: #666;
        }

        .z-score {
            font-weight: 600;
        }

        .z-score.positive { color: #ff4757; }
        .z-score.negative { color: #2ed573; }

        .alert-time {
            font-size: 0.8rem;
            color: #666;
        }

        .alert-explanation {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ccc;
            border-left: 3px solid #4a90d9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Scrollbar styling */
        .alerts-list::-webkit-scrollbar {
            width: 8px;
        }

        .alerts-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .alerts-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .alerts-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Anomaly Detector</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Alerts</h3>
                <div class="value" id="totalAlerts">0</div>
            </div>
            <div class="stat-card">
                <h3>Critical</h3>
                <div class="value" style="color: #ff4757;" id="criticalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>High</h3>
                <div class="value" style="color: #ff6b35;" id="highCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Tickers</h3>
                <div class="value" style="color: #4a90d9;" id="tickerCount">0</div>
            </div>
        </div>

        <div class="alerts-container">
            <div class="alerts-header">
                <h2>🚨 Live Alerts</h2>
                <button class="clear-btn" onclick="clearAlerts()">Clear All</button>
            </div>
            <div class="alerts-list" id="alertsList">
                <div class="empty-state">
                    <div class="icon">📊</div>
                    <p>Waiting for anomalies...</p>
                    <p style="font-size: 0.85rem; margin-top: 8px;">Alerts will appear here in real-time</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let alerts = [];
        let tickers = new Set();
        let severityCounts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/anomalies`);

            ws.onopen = () => {
                document.getElementById('statusDot').className = 'status-dot connected';
                document.getElementById('statusText').textContent = 'Connected';
                console.log('WebSocket connected');
            };

            ws.onclose = () => {
                document.getElementById('statusDot').className = 'status-dot disconnected';
                document.getElementById('statusText').textContent = 'Disconnected';
                console.log('WebSocket disconnected, reconnecting in 3s...');
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const alert = JSON.parse(event.data);
                handleAlert(alert);
            };
        }

        function handleAlert(alert) {
            alerts.unshift(alert);
            tickers.add(alert.ticker);
            severityCounts[alert.severity]++;

            updateStats();
            renderAlerts();

            // Play notification sound for critical alerts
            if (alert.severity === 'CRITICAL') {
                playNotificationSound();
            }
        }

        function updateStats() {
            document.getElementById('totalAlerts').textContent = alerts.length;
            document.getElementById('criticalCount').textContent = severityCounts.CRITICAL;
            document.getElementById('highCount').textContent = severityCounts.HIGH;
            document.getElementById('tickerCount').textContent = tickers.size;
        }

        function renderAlerts() {
            const container = document.getElementById('alertsList');
            
            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📊</div>
                        <p>Waiting for anomalies...</p>
                        <p style="font-size: 0.85rem; margin-top: 8px;">Alerts will appear here in real-time</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = alerts.slice(0, 50).map(alert => `
                <div class="alert-item">
                    <div class="alert-header">
                        <div class="alert-ticker">
                            <span class="severity-badge severity-${alert.severity}">${alert.severity}</span>
                            <span class="ticker-symbol">${alert.ticker}</span>
                            <span class="anomaly-type">${alert.anomalyType}</span>
                        </div>
                        <div class="alert-metrics">
                            <div class="metric">
                                <span class="metric-label">Z-Score:</span>
                                <span class="z-score ${alert.zScore > 0 ? 'positive' : 'negative'}">
                                    ${alert.zScore > 0 ? '+' : ''}${alert.zScore.toFixed(2)}σ
                                </span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Price:</span>
                                <span>$${alert.price.toFixed(2)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Volume:</span>
                                <span>${formatVolume(alert.volume)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="alert-explanation">
                        💡 ${alert.explanation}
                    </div>
                    <div class="alert-time" style="margin-top: 8px;">
                        ${formatTime(alert.timestamp)}
                    </div>
                </div>
            `).join('');
        }

        function formatVolume(volume) {
            if (volume >= 1000000) return (volume / 1000000).toFixed(1) + 'M';
            if (volume >= 1000) return (volume / 1000).toFixed(1) + 'K';
            return volume.toFixed(0);
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        function clearAlerts() {
            alerts = [];
            tickers.clear();
            severityCounts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
            updateStats();
            renderAlerts();
        }

        function playNotificationSound() {
            // Simple beep using Web Audio API
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                // Audio not supported
            }
        }

        // Connect on page load
        connect();
    </script>
</body>
</html>
